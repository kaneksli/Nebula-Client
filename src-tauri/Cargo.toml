[package]
name = "vpn-client"
version = "0.1.0"
description = "Cross-platform VPN/proxy subscription client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["system-tray", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "net"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
